<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中華郵政包裹查詢測試</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Microsoft JhengHei", Arial, sans-serif;
      background: linear-gradient(135deg, #eef8ef, #f7fbf8);
      color: #123;
    }
    .wrap {
      max-width: 960px;
      margin: 32px auto;
      background: #fff;
      border-radius: 18px;
      padding: 28px;
      box-shadow: 0 16px 42px rgba(20, 80, 50, .12);
    }
    h1 { margin: 0 0 8px; color: #087a3a; font-size: 28px; }
    .desc { color: #48635a; line-height: 1.7; margin-bottom: 22px; }
    label { display: block; font-weight: 700; margin: 16px 0 8px; }
    textarea {
      width: 100%; min-height: 130px; border: 1px solid #bed8c6; border-radius: 12px;
      padding: 14px; font-size: 16px; outline: none;
    }
    textarea:focus { border-color: #2ea957; box-shadow: 0 0 0 3px rgba(46,169,87,.13); }
    .actions { margin: 18px 0; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    button {
      border: 0; border-radius: 12px; padding: 13px 24px; font-weight: 700; font-size: 16px;
      color: white; background: #2ea957; cursor: pointer;
    }
    button.secondary { background: #607d8b; }
    button:disabled { opacity: .55; cursor: wait; }
    .hint { font-size: 14px; color: #5d7066; }
    .error {
      white-space: pre-wrap; color: #b00020; background: #fff1f1; border-radius: 12px;
      padding: 14px; margin: 16px 0; display: none;
    }
    .result { margin-top: 22px; display: grid; gap: 16px; }
    .card { border: 1px solid #d8e9de; border-radius: 14px; overflow: hidden; }
    .cardHead { background: #f2faf4; padding: 14px 16px; display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .mail { font-weight: 800; color: #075f31; }
    .badge { padding: 4px 10px; border-radius: 999px; background: #d9f4e2; color: #087a3a; font-size: 13px; }
    .badge.empty { background: #f4e8d9; color: #8a5200; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 12px 14px; border-top: 1px solid #edf2ef; text-align: left; vertical-align: top; }
    th { background: #fbfdfb; color: #456; font-size: 14px; }
    .empty { padding: 18px; color: #666; }
    details { margin-top: 10px; color: #666; }
    pre { overflow: auto; max-height: 240px; background: #111922; color: #d7f3df; border-radius: 10px; padding: 12px; }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>中華郵政包裹查詢測試</h1>
    <div class="desc">
      此版已完全移除 Playwright / Chromium，不需要圖形驗證碼。後端直接呼叫中華郵政郵件查詢介接端點，適合 Render 免費方案測試。
    </div>

    <label for="mailNos">郵件號碼</label>
    <textarea id="mailNos" placeholder="每行一筆，例如：&#10;02297230001516">02297230001516</textarea>

    <div class="actions">
      <button id="queryBtn">查詢</button>
      <button class="secondary" id="clearBtn" type="button">清除結果</button>
      <span class="hint">可輸入多筆，最多一次查 10 筆。</span>
    </div>

    <div id="error" class="error"></div>
    <section id="result" class="result"></section>
  </main>

  <script>
    const queryBtn = document.getElementById('queryBtn');
    const clearBtn = document.getElementById('clearBtn');
    const mailNos = document.getElementById('mailNos');
    const result = document.getElementById('result');
    const error = document.getElementById('error');

    clearBtn.addEventListener('click', () => {
      result.innerHTML = '';
      error.style.display = 'none';
      error.textContent = '';
    });

    queryBtn.addEventListener('click', async () => {
      error.style.display = 'none';
      error.textContent = '';
      result.innerHTML = '';
      queryBtn.disabled = true;
      queryBtn.textContent = '查詢中...';

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ mailNos: mailNos.value })
        });
        const data = await res.json();
        if (!data.ok) throw new Error(data.message + (data.detail ? '\n' + data.detail : ''));
        renderResults(data.results || []);
      } catch (e) {
        error.textContent = e.message || String(e);
        error.style.display = 'block';
      } finally {
        queryBtn.disabled = false;
        queryBtn.textContent = '查詢';
      }
    });

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));
    }

    function renderResults(items) {
      if (!items.length) {
        result.innerHTML = '<div class="empty">尚無結果</div>';
        return;
      }
      result.innerHTML = items.map(item => {
        const rows = (item.history || []).map(row => `
          <tr>
            <td>${escapeHtml(row.datetime)}</td>
            <td>${escapeHtml(row.status)}</td>
            <td>${escapeHtml(row.station)}</td>
            <td>${escapeHtml(row.remark)}</td>
          </tr>
        `).join('');

        return `
          <article class="card">
            <div class="cardHead">
              <div class="mail">${escapeHtml(item.mailNo)}</div>
              <div class="badge ${item.found ? '' : 'empty'}">${escapeHtml(item.message)}</div>
            </div>
            ${item.found ? `
              <table>
                <thead><tr><th>處理時間</th><th>狀態</th><th>處理局</th><th>備註</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            ` : `<div class="empty">查無郵件處理歷程。</div>`}
          </article>
        `;
      }).join('');
    }
  </script>
</body>
</html>
